name: Daily Model Retrain

on:
  schedule:
    - cron: "30 3 * * *"  # 03:30 UTC every day
  workflow_dispatch: {}

permissions:
  contents: write  # needed to commit the retrained model file back to the repo

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Retrain model and update ensemble weights
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python retrain.py

      - name: Commit updated model file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/models/xrp_model.joblib backend/models/calibration.joblib
          git diff --cached --quiet || git commit -m "chore: daily model retrain"
          git push
