name: Daily Email Report

on:
  schedule:
    - cron: "10 15 * * *"  # 18:10 Turkey time (fixed UTC+3, no DST)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # Stand-down gate. Since 2026-10-05 the PRIMARY trigger is a
  # workflow_dispatch from the user's machine (Task Scheduler "XRP-Guess
  # Report Trigger", daily 18:10 TR), because this cron had drifted to
  # starting at 18:37-21:12 UTC -- the mail arrived 3.5-6 hours late. The
  # cron stays as the fallback for an evening that machine is off. Only a
  # SCHEDULED run checks, and it looks only for DISPATCHED runs;
  # backend/trigger_workflow.ps1 guards the other order and replays this
  # rule, so the 12 hours must match its -WindowHours. daily_report.py
  # writes nothing, so two runs would be two mails.
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Stand down if this evening's mail was already dispatched
        id: check
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff=$(date -u -d '12 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh run list -R "$GITHUB_REPOSITORY" -w daily_report.yml --event workflow_dispatch -L 20 \
                --json createdAt,conclusion \
                --jq "[.[] | select(.createdAt >= \"$cutoff\" and .conclusion != \"failure\" and .conclusion != \"cancelled\")] | length")
          echo "dispatched daily_report.yml runs since $cutoff: $n"
          if [ "$n" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Standing down: this evening's mail was dispatched from the user's machine."
          fi

  report:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Send daily report email
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_RECIPIENT: ${{ secrets.REPORT_RECIPIENT }}
        run: python daily_report.py
