name: Kanal Finans TS Watcher

on:
  schedule:
    - cron: "12 5,11,15,20 * * *"  # 08:12 / 14:12 / 18:12 / 23:12 Turkey time
  workflow_dispatch: {}   # allows manual "Run workflow" trigger for testing

permissions:
  contents: read

jobs:
  kanal_finans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Check Kanal Finans channel for new videos
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python kanal_finans.py
