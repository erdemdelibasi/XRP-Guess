name: Kanal Finans TS Watcher

# No `schedule:` trigger -- confirmed live (2026-09-02) that GitHub Actions'
# runner IP gets a systematic RequestBlocked from YouTube's transcript
# endpoint (see CLAUDE.md), so this currently runs 4x/day from the user's own
# machine instead (backend/run_kanal_finans.ps1 + Windows Task Scheduler).
# Kept here as workflow_dispatch-only for manual testing, and so cron can be
# re-enabled later without recreating the file (e.g. if a Webshare proxy --
# WEBSHARE_PROXY_USERNAME/PASSWORD secrets below -- gets set up).
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  kanal_finans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Check Kanal Finans channel for new videos
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WEBSHARE_PROXY_USERNAME: ${{ secrets.WEBSHARE_PROXY_USERNAME }}
          WEBSHARE_PROXY_PASSWORD: ${{ secrets.WEBSHARE_PROXY_PASSWORD }}
        run: python kanal_finans.py
